<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" opacity="0.5" />
    </pattern>

    
    <clipPath id="typing-clip">
      <rect x="45" y="105" width="760" height="35">
        <animate attributeName="width" from="0" to="760" dur="2.5s" fill="freeze" calcMode="spline" keySplines="0.42 0 0.58 1" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 36px;
      fill: #F8FAFC;
      letter-spacing: 0.5px;
      opacity: 0;
      animation: fadeSlideDown 0.9s ease-out forwards;
    }

    .subtitle {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-weight: 500;
      font-size: 16px;
      fill: #38BDF8;
    }

    .pill-bg {
      fill: rgba(30, 41, 59, 0.75);
      stroke: #334155;
      stroke-width: 1;
    }

    .pill-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12.5px;
      font-weight: 600;
      fill: #E2E8F0;
      text-anchor: middle;
    }

    .pill-group {
      opacity: 0;
      animation: popUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-1 { animation-delay: 0.6s; }
    .delay-2 { animation-delay: 0.8s; }
    .delay-3 { animation-delay: 1.0s; }
    .delay-4 { animation-delay: 1.2s; }
    .delay-5 { animation-delay: 1.4s; }
    .delay-6 { animation-delay: 1.6s; }
    .delay-7 { animation-delay: 1.8s; }

    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
    }

    .node-pulse-alt {
      animation: pulse 3s infinite ease-in-out 1.5s;
    }

    .scanline {
      animation: scan 6s linear infinite;
    }

    @keyframes fadeSlideDown {
      0% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes popUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.25; r: 3; }
      50% { opacity: 0.9; r: 5; }
    }

    @keyframes scan {
      0% { transform: translateX(-850px); }
      100% { transform: translateX(850px); }
    }
  </style>

  
  <rect x="2" y="2" width="846" height="256" rx="14" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2" />
  <rect x="2" y="2" width="846" height="256" rx="14" fill="url(#grid)" />

  
  <rect x="2" y="2" width="846" height="4" rx="2" fill="url(#accent-grad)" opacity="0.85" />
  <rect class="scanline" x="0" y="2" width="200" height="4" fill="#FFFFFF" opacity="0.5" filter="url(#neon-glow)" />

  
  <g stroke="#3B82F6" stroke-width="1" opacity="0.3">
    <line x1="690" y1="50" x2="760" y2="85" />
    <line x1="690" y1="50" x2="740" y2="140" />
    <line x1="760" y1="85" x2="805" y2="60" />
    <line x1="760" y1="85" x2="795" y2="135" />
    <line x1="740" y1="140" x2="795" y2="135" />
    <line x1="740" y1="140" x2="710" y2="195" />
    <line x1="795" y1="135" x2="775" y2="205" />
    <line x1="710" y1="195" x2="775" y2="205" />
  </g>
  <g fill="#00F5D4" filter="url(#neon-glow)">
    <circle class="node-pulse" cx="690" cy="50" r="3.5" />
    <circle class="node-pulse-alt" cx="760" cy="85" r="4" />
    <circle class="node-pulse" cx="805" cy="60" r="3" />
    <circle class="node-pulse-alt" cx="740" cy="140" r="3.5" />
    <circle class="node-pulse" cx="795" cy="135" r="4" />
    <circle class="node-pulse-alt" cx="710" cy="195" r="3" />
    <circle class="node-pulse" cx="775" cy="205" r="3.5" />
  </g>

  
  <g transform="translate(45, 32)">
    <rect x="0" y="0" width="165" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16" font-family="monospace" font-size="11" fill="#94A3B8">SYSTEM.ONLINE // AI</text>
  </g>

  
  <text x="45" y="96" class="title">Pavindu Dulshan Bhashitha</text>

  
  <g clip-path="url(#typing-clip)">
    <text x="45" y="128" class="subtitle">&gt; AI Undergraduate @ University of Moratuwa | Software &amp; Embedded Dev</text>
  </g>

  
  <line x1="45" y1="148" x2="640" y2="148" stroke="#1E293B" stroke-width="1.5" />

  
  <g transform="translate(45, 165)">
    
    <g transform="translate(0, 0)">
      <g class="pill-group delay-1">
        <rect x="0" y="0" width="145" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#38BDF8" />
        <text x="80" y="19" class="pill-text">Python / PyTorch</text>
      </g>
    </g>

    
    <g transform="translate(157, 0)">
      <g class="pill-group delay-2">
        <rect x="0" y="0" width="110" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#818CF8" />
        <text x="62" y="19" class="pill-text">C / DSA</text>
      </g>
    </g>

    
    <g transform="translate(279, 0)">
      <g class="pill-group delay-3">
        <rect x="0" y="0" width="142" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#00F5D4" />
        <text x="78" y="19" class="pill-text">React / Node.js</text>
      </g>
    </g>

    
    <g transform="translate(433, 0)">
      <g class="pill-group delay-4">
        <rect x="0" y="0" width="125" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#F472B6" />
        <text x="69" y="19" class="pill-text">PHP / MySQL</text>
      </g>
    </g>
  </g>

  
  <g transform="translate(45, 206)">
    
    <g transform="translate(0, 0)">
      <g class="pill-group delay-5">
        <rect x="0" y="0" width="170" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#34D399" />
        <text x="92" y="19" class="pill-text">ESP32 / Embedded IoT</text>
      </g>
    </g>

    
    <g transform="translate(182, 0)">
      <g class="pill-group delay-6">
        <rect x="0" y="0" width="138" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#A78BFA" />
        <text x="76" y="19" class="pill-text">LLMs &amp; AI APIs</text>
      </g>
    </g>

    
    <g transform="translate(332, 0)">
      <g class="pill-group delay-7">
        <rect x="0" y="0" width="105" height="30" rx="6" class="pill-bg" />
        <circle cx="14" cy="15" r="3.5" fill="#FBBF24" />
        <text x="59" y="19" class="pill-text">Godot 4</text>
      </g>
    </g>
  </g>
</svg>