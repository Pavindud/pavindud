<svg width="800" height="240" viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="105" height="30" width="0"><animate attributeName="width" from="0" to="480" dur="2s" begin="1s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="145" height="30" width="0"><animate attributeName="width" from="0" to="480" dur="2s" begin="3.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="185" height="30" width="0"><animate attributeName="width" from="0" to="480" dur="2s" begin="6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#bg)"/>

  <circle cx="680" cy="60" r="38" fill="#38bdf8" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" values="0,0;-20,18;0,0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="170" r="55" fill="#a78bfa" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" values="0,0;15,-22;0,0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="610" cy="200" r="24" fill="#f472b6" opacity="0.14">
    <animateTransform attributeName="transform" type="translate" values="0,0;-12,-14;0,0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <text x="40" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#title)" opacity="0">
    Pavindu
    <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
  </text>

  <g font-family="Courier New, monospace" font-size="20" fill="#e2e8f0">
    <text x="40" y="127" clip-path="url(#c1)">&gt; AI undergrad @ University of Moratuwa</text>
    <text x="40" y="167" clip-path="url(#c2)">&gt; building web apps and automation tools</text>
    <text x="40" y="207" clip-path="url(#c3)">&gt; learning machine learning and web dev</text>
  </g>

  <rect x="525" y="190" width="12" height="22" fill="#38bdf8" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="8s" repeatCount="indefinite"/>
  </rect>
</svg>